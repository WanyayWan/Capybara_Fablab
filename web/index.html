<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Control Panel</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="panel">
      <header class="topbar">
        <div>
          <h1>ESP32 Control Panel</h1>
          <p id="status" class="status disconnected">Disconnected</p>
        </div>
        <button id="connectBtn" type="button">Connect ESP32</button>
      </header>

      <section class="controls" aria-label="LED controls">
        <button id="ledOnBtn" type="button" disabled>LED ON</button>
        <button id="ledOffBtn" type="button" disabled>LED OFF</button>
      </section>

      <section class="log-wrap" aria-label="Serial and event log">
        <div id="log" class="log"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
